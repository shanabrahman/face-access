name: Python tests

on:
  push:
    branches:
      - vercel-readiness
  pull_request:
    branches:
      - vercel-readiness

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q server.py database.py database_postgres.py database_sqlite.py storage.py chatbot_service.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
